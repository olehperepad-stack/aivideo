[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "framepilot"
version = "0.15.3"
description = "Local object tracking and framing for video, photos, cameras and OBS"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3",
    "opencv-python-headless>=4.10,<5",
    "PySide6>=6.8,<7",
    "websocket-client>=1.8,<2",
    "imageio-ffmpeg>=0.6,<1",
    "pyobjc-framework-Vision>=11,<13; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=11,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
framepilot = "framepilot.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
framepilot = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
